<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Background Glow -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Login Container Card -->
  <rect x="360" y="140" width="480" height="520" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Logo Icon -->
  <rect x="564" y="180" width="72" height="72" rx="16" fill="#312e81" stroke="#4338ca" stroke-width="2"/>
  <path d="M584 226 L600 200 L616 226 Z" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="226" r="4" fill="#a5b4fc"/>

  <!-- Title & Subtitle -->
  <text x="600" y="285" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Mini ERP + CRM Portal</text>
  <text x="600" y="310" text-anchor="middle" font-size="13" fill="#94a3b8">Sign in with your organizational credentials</text>

  <!-- Input Field 1: Email -->
  <text x="400" y="355" font-size="12" font-weight="600" fill="#cbd5e1">Email Address</text>
  <rect x="400" y="365" width="400" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="416" y="392" font-size="14" fill="#f8fafc">admin@minierp.com</text>

  <!-- Input Field 2: Password -->
  <text x="400" y="435" font-size="12" font-weight="600" fill="#cbd5e1">Password</text>
  <rect x="400" y="445" width="400" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="416" y="472" font-size="14" fill="#f8fafc">••••••••••••</text>

  <!-- Login Button -->
  <rect x="400" y="515" width="400" height="46" rx="8" fill="url(#btnGrad)"/>
  <text x="600" y="543" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Sign In to Dashboard →</text>

  <!-- Demo Accounts Badge -->
  <rect x="400" y="585" width="400" height="45" rx="8" fill="#1e1b4b" stroke="#3730a3" stroke-dasharray="4 4"/>
  <text x="600" y="612" text-anchor="middle" font-size="12" fill="#a5b4fc">Demo Roles: Admin • Sales • Warehouse • Accounts</text>
</svg>
