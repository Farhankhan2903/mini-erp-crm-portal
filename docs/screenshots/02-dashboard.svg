<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="240" height="800" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Logo Header -->
  <rect x="20" y="24" width="36" height="36" rx="8" fill="#4f46e5"/>
  <text x="68" y="47" font-size="16" font-weight="700" fill="#ffffff">Mini ERP+CRM</text>

  <!-- Sidebar Nav Items -->
  <rect x="12" y="90" width="216" height="40" rx="8" fill="#312e81"/>
  <text x="44" y="115" font-size="14" font-weight="600" fill="#818cf8">📊 Dashboard</text>
  <text x="44" y="165" font-size="14" fill="#94a3b8">🏢 Customers CRM</text>
  <text x="44" y="215" font-size="14" fill="#94a3b8">📦 Products Catalog</text>
  <text x="44" y="265" font-size="14" fill="#94a3b8">🔄 Stock Movements</text>
  <text x="44" y="315" font-size="14" fill="#94a3b8">📄 Sales Challans</text>

  <!-- Top Header Bar -->
  <rect x="240" y="0" width="960" height="70" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="270" y="42" font-size="20" font-weight="700" fill="#ffffff">Operations Overview</text>
  <rect x="1050" y="20" width="120" height="32" rx="16" fill="#312e81"/>
  <text x="1110" y="41" text-anchor="middle" font-size="12" font-weight="600" fill="#a5b4fc">👑 ADMIN</text>

  <!-- 4 KPI Cards Grid -->
  <!-- Card 1: Customers -->
  <rect x="270" y="100" width="210" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="290" y="130" font-size="12" fill="#94a3b8">TOTAL CUSTOMERS</text>
  <text x="290" y="165" font-size="28" font-weight="700" fill="#ffffff">42</text>
  <text x="290" y="190" font-size="11" fill="#10b981">↑ +12.5% this month</text>

  <!-- Card 2: Products -->
  <rect x="500" y="100" width="210" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="520" y="130" font-size="12" fill="#94a3b8">TOTAL PRODUCTS</text>
  <text x="520" y="165" font-size="28" font-weight="700" fill="#ffffff">128</text>
  <text x="520" y="190" font-size="11" fill="#38bdf8">Active SKUs listed</text>

  <!-- Card 3: Today's Challans -->
  <rect x="730" y="100" width="210" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="750" y="130" font-size="12" fill="#94a3b8">TODAY'S CHALLANS</text>
  <text x="750" y="165" font-size="28" font-weight="700" fill="#ffffff">15</text>
  <text x="750" y="190" font-size="11" fill="#818cf8">₹4,85,000 Total Value</text>

  <!-- Card 4: Low Stock Alert -->
  <rect x="960" y="100" width="210" height="110" rx="12" fill="#451a03" stroke="#78350f" stroke-width="1"/>
  <text x="980" y="130" font-size="12" fill="#fcd34d">LOW STOCK ALERT</text>
  <text x="980" y="165" font-size="28" font-weight="700" fill="#f59e0b">3 SKUs</text>
  <text x="980" y="190" font-size="11" fill="#fbbf24">Requires reorder</text>

  <!-- Table Section: Recent Sales Challans -->
  <rect x="270" y="240" width="900" height="520" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="280" font-size="16" font-weight="700" fill="#ffffff">Recent Sales Challans Audit Stream</text>

  <!-- Table Header -->
  <rect x="300" y="300" width="840" height="36" fill="#0f172a" rx="6"/>
  <text x="320" y="323" font-size="12" font-weight="600" fill="#94a3b8">CHALLAN #</text>
  <text x="480" y="323" font-size="12" font-weight="600" fill="#94a3b8">CUSTOMER</text>
  <text x="700" y="323" font-size="12" font-weight="600" fill="#94a3b8">QTY</text>
  <text x="800" y="323" font-size="12" font-weight="600" fill="#94a3b8">STATUS</text>
  <text x="980" y="323" font-size="12" font-weight="600" fill="#94a3b8">CREATED BY</text>

  <!-- Row 1 -->
  <text x="320" y="365" font-size="13" font-weight="600" fill="#818cf8">SCH-20260810-0001</text>
  <text x="480" y="365" font-size="13" fill="#f8fafc">Acme Global Corporation</text>
  <text x="700" y="365" font-size="13" fill="#cbd5e1">15 pcs</text>
  <rect x="800" y="350" width="100" height="22" rx="11" fill="#064e3b"/>
  <text x="850" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">DISPATCHED</text>
  <text x="980" y="365" font-size="13" fill="#cbd5e1">Sarah Sales</text>

  <!-- Row 2 -->
  <text x="320" y="415" font-size="13" font-weight="600" fill="#818cf8">SCH-20260810-0002</text>
  <text x="480" y="415" font-size="13" fill="#f8fafc">TechCorp Solutions Ltd</text>
  <text x="700" y="415" font-size="13" fill="#cbd5e1">8 pcs</text>
  <rect x="800" y="400" width="100" height="22" rx="11" fill="#1e3a8a"/>
  <text x="850" y="415" text-anchor="middle" font-size="11" font-weight="600" fill="#60a5fa">CONFIRMED</text>
  <text x="980" y="415" font-size="13" fill="#cbd5e1">System Admin</text>
</svg>
