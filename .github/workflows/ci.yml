name: Mini ERP + CRM Portal CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  ci:
    name: Complete System Build, Test & Lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-secret-key-testing-minierp-12345"
      NODE_ENV: "test"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install --legacy-peer-deps

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Generate Prisma Client Schema
        run: |
          cd backend
          npx prisma generate

      - name: Bootstrap Test Database & Seed Data
        run: |
          cd backend
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Run Backend Integration Tests
        run: |
          cd backend
          npm test

      - name: Run Backend ESLint & TypeCheck
        run: |
          cd backend
          npm run lint
          npm run build

      - name: Run Frontend Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Run Frontend ESLint & Production Build
        run: |
          cd frontend
          npm run lint
          npm run build
