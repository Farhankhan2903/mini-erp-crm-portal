name: Mini ERP + CRM Portal CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-secret-key-testing-minierp-12345"
      NODE_ENV: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Prepare Test Database Schema & Seed Data
        run: |
          cd backend
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: ESLint Linting Check
        run: |
          cd backend
          npm run lint

      - name: TypeScript Build Check
        run: |
          cd backend
          npm run build

      - name: Run Backend Integration Tests
        run: |
          cd backend
          npm test

  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: ESLint Linting Check
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Compile Frontend Vite Production Bundle
        run: |
          cd frontend
          npm run build
